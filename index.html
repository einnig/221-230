            "es": "<p><b>Clase de palabra:</b> Adverbio / Preposición</p><p><b>Explicación 1:</b> Estar afuera, no dentro de algo.</p><p><b>Ejemplo 1:</b> Él estaba <b>fuera</b> de la casa.</p><p><b>Explicación 2:</b> Salir de algo (por ejemplo, salir del país).</p><p><b>Ejemplo 2:</b> Ella se fue al <b>extranjero</b> de vacaciones.</p>",

        }
    },
    {

        translations: {

            "da": "<p><b>Ordklasse:</b> Tillægsord</p><p><b>Forklaring 1:</b> Et stort antal af hunkønsord (flertal).</p><p><b>Eksempel 1:</b> Der var <b>mange</b> kvinder der.</p><p><b>Forklaring 2:</b> Når man gør noget meget ofte eller har mange ting.</p><p><b>Eksempel 2:</b> Jeg har læst <b>mange</b> bøger.</p>",
            "en": "<p><b>Word class:</b> Adjective</p><p><b>Explanation 1:</b> A large number of feminine words (plural).</p><p><b>Example 1:</b> There were <b>many</b> women there.</p><p><b>Explanation 2:</b> When you do something very often or have many things.</p><p><b>Example 2:</b> I have read <b>many</b> books.</p>",
            "tl": "<p><b>Bahagi:</b> Pang-uri</p><p><b>Paliwanag 1:</b> Malaking bilang ng mga salitang pambabae (maramihan).</p><p><b>Halimbawa 1:</b> Mayroong <b>maraming</b> babae doon.</p><p><b>Paliwanag 2:</b> Kapag madalas mong ginagawa ang isang bagay o may maraming bagay.</p><p><b>Halimbawa 2:</b> Nakabasa na ako ng <b>maraming</b> libro.</p>",
            "no": "<p><b>Ordklasse:</b> Adjektiv</p><p><b>Forklaring 1:</b> Et stort antall av hunkjønnsord (flertall).</p><p><b>Eksempel 1:</b> Det var <b>mange</b> kvinner der.</p><p><b>Forklaring 2:</b> Når man gjør noe svært ofte eller har mange ting.</p><p><b>Eksempel 2:</b> Jeg har lest <b>mange</b> bøker.</p>",
            "fa": "<div dir='rtl' style='text-align: right;'><p><b>نوع کلمه:</b> صفت</p><p><b>توضیح 1:</b> تعداد زیادی از کلمات مونث (جمع).</p><p><b>مثال 1:</b> زنان <b>بسیاری</b> آنجا بودند.</p><p><b>توضیح 2:</b> وقتی کاری را زیاد انجام می‌دهید یا چیزهای زیادی دارید.</p><p><b>مثال 2:</b> من کتاب‌های <b>بسیاری</b> خوانده‌ام.</p></div>",
            "pl": "<p><b>Część mowy:</b> Przymiotnik</p><p><b>Wyjaśnienie 1:</b> Duża liczba słów żeńskich (liczba mnoga).</p><p><b>Przykład 1:</b> Było tam <b>wiele</b> kobiet.</p><p><b>Wyjaśnienie 2:</b> Kiedy robisz coś bardzo często lub masz wiele rzeczy.</p><p><b>Przykład 2:</b> Przeczytałem <b>wiele</b> książek.</p>",
            "ru": "<p><b>Часть речи:</b> Прилагательное</p><p><b>Объяснение 1:</b> Большое количество слов женского рода (множественное число).</p><p><b>Пример 1:</b> Там было <b>много</b> женщин.</p><p><b>Объяснение 2:</b> Когда вы делаете что-то очень часто или имеете много вещей.</p><p><b>Пример 2:</b> Я прочитал <b>много</b> книг.</p>",
            "es": "<p><b>Clase de palabra:</b> Adjetivo</p><p><b>Explicación 1:</b> Una gran cantidad de palabras femeninas (plural).</p><p><b>Ejemplo 1:</b> Había <b>muchas</b> mujeres allí.</p><p><b>Explicación 2:</b> Cuando haces algo con frecuencia o tienes muchas cosas.</p><p><b>Ejemplo 2:</b> He leído <b>muchos</b> libros.</p>",
            "sv": "<p><b>Ordklass:</b> Adjektiv</p><p><b>Förklaring 1:</b> Ett stort antal av feminina ord (plural).</p><p><b>Exempel 1:</b> Det fanns <b>många</b> kvinnor där.</p><p><b>Förklaring 2:</b> När man gör något väldigt ofta eller har många saker.</p><p><b>Exempel 2:</b> Jag har läst <b>många</b> böcker.</p>",
            "th": "<p><b>ชนิดของคำ:</b> คำคุณศัพท์</p><p><b>คำอธิบาย 1:</b> คำนามเพศหญิงจำนวนมาก (พหูพจน์)</p><p><b>ตัวอย่าง 1:</b> มีผู้หญิง<b>มากมาย</b>ที่นั่น</p><p><b>คำอธิบาย 2:</b> เมื่อคุณทำสิ่งใดสิ่งหนึ่งบ่อยมาก หรือมีสิ่งของมากมาย</p><p><b>ตัวอย่าง 2:</b> ฉันได้อ่านหนังสือมา<b>มากมาย</b></p>",
            "uk": "<p><b>Частина мови:</b> Прикметник</p><p><b>Пояснення 1:</b> Велика кількість слів жіночого роду (множина).</p><p><b>Приклад 1:</b> Там було <b>багато</b> жінок.</p><p><b>Пояснення 2:</b> Коли ви робите щось дуже часто або маєте багато речей.</p><p><b>Приклад 2:</b> Я прочитав <b>багато</b> книг.</p>",
            "vi": "<p><b>Loại từ:</b> Tính từ</p><p><b>Giải thích 1:</b> Một số lượng lớn các từ giống cái (số nhiều).</p><p><b>Ví dụ 1:</b> Có <b>nhiều</b> phụ nữ ở đó.</p><p><b>Giải thích 2:</b> Khi bạn làm một việc gì đó rất thường xuyên hoặc có nhiều thứ.</p><p><b>Ví dụ 2:</b> Tôi đã đọc <b>nhiều</b> cuốn sách.</p>"
        }

];

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");
let currentIndex = 0, recognition, isRecording = false, autoAdvanceTimer = null, hasDownloadedCert = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) { btn.innerText = "🎤 Tala"; btn.classList.remove('recording'); }
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") resDiv.innerText = "";
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { updateUI(); };

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) { if (userScores[i] === 100) correctCount++; }
    const percent = (correctCount / exerciseData.length) * 100;
    const progressBar = document.getElementById('progress-bar');
    if(progressBar) progressBar.style.width = percent + '%';
    return correctCount;
}

function findNextUnfinished() {
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) { currentIndex = i; break; }
    }
    document.getElementById('completion-view').style.display = 'none';
    document.getElementById('exercise-view').style.display = 'block';
    updateUI();
}

function updateUI() {
    clearTimeout(autoAdvanceTimer); 
    const correctCount = updateProgress();

    if (currentIndex >= exerciseData.length) {
        document.getElementById('exercise-view').style.display = 'none';
        const completionView = document.getElementById('completion-view');
        completionView.style.display = 'block';

        if (correctCount === exerciseData.length) {
            completionView.innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: 100%;"></div></div>
                <h1 style="color: #34a853; font-size: 2.5em;">Frábært! Þú náðir 100% árangri! 🎉</h1>
                <p style="font-size: 1.2em; color: #555;">Skrifaðu nafnið þitt hér að neðan til að sækja viðurkenningarskjalið þitt.</p>
                <input type="text" id="studentName" placeholder="Skrifaðu nafnið þitt hér" autocomplete="off" ${hasDownloadedCert ? 'disabled' : ''}><br>
                <button id="cert-btn" class="btn" style="background-color: ${hasDownloadedCert ? '#5f6368' : '#1a73e8'}; font-size: 1.5em; padding: 15px 30px; margin-top: 10px; cursor: ${hasDownloadedCert ? 'not-allowed' : 'pointer'}; opacity: ${hasDownloadedCert ? '0.7' : '1'};" onclick="downloadCert()" ${hasDownloadedCert ? 'disabled' : ''}>
                    ${hasDownloadedCert ? '✅ Skjal sótt' : '🏆 Sækja viðurkenningarskjal'}
                </button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja nýja umferð</button>
                <div class="feedback-note">Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a></div>
            `;
        } else {
            completionView.innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af ${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
                <div class="feedback-note">Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a></div>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    const langSelect = document.getElementById('languageSelect');
    const selectedLang = langSelect ? langSelect.value : 'none';

    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af ${exerciseData.length}`;
    
    const mediaBox = document.getElementById('media-box');
    if (selectedLang === 'none' || selectedLang === "") {
        mediaBox.innerHTML = "<i style='color: #666;'>Vinsamlegast veldu tungumál af listanum að ofan til að sjá þýðingu.</i>";
    } else {
        mediaBox.innerHTML = curr.translations[selectedLang] || "Þýðing ekki til / Translation missing";
    }

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() { currentIndex++; updateUI(); }
function prevExercise() { if (currentIndex > 0) { currentIndex--; updateUI(); } }

function toggleRecord() {
    if (!recognition) return;
    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) { console.log("Villa í upptöku: " + e); }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript.trim().toLowerCase(); 
        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        let score = 0;
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;
        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => { nextExercise(); }, 1000); 
        }
    };
}

function downloadCert() {
    if (hasDownloadedCert) return; 
    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") { alert("Vinsamlegast skrifaðu nafnið þitt fyrst!"); return; }

    const canvas = document.createElement('canvas');
    canvas.width = 900; canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#1a73e8'; ctx.lineWidth = 15; ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
    ctx.strokeStyle = '#fbbc05'; ctx.lineWidth = 5; ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8'; ctx.textAlign = 'center'; ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333'; ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000'; ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333'; ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8'; ctx.font = 'bold 26px Arial';
    ctx.fillText('Markorð: 221 - 230 algengustu orðin.', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853'; ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666'; ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    hasDownloadedCert = true;
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true; btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368"; btn.style.cursor = "not-allowed"; btn.style.opacity = "0.7";
    }
    if (studentNameInput) studentNameInput.disabled = true;
}
</script>
</body>
</html>
